<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Station Builder</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "../js/vendor/three/three.module.js",
    "three/addons/": "../js/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>

  <div id="app">
    <canvas id="viewport"></canvas>

    <div id="topbar" class="hud">
      <div class="topbar-group brand">
        <span class="brand-title">🏗️ Station Builder</span>
      </div>
      <div class="topbar-group stats">
        <div class="stat" title="Budget">💰 <span id="stat-budget">$0</span></div>
        <div class="stat" title="Stations built">🏢 <span id="stat-station-count">0</span></div>
      </div>
    </div>

    <div id="hint-banner" class="hud"></div>

    <div id="toolbar" class="hud">
      <div class="toolbar-section">
        <h3>Station Type</h3>
        <div id="type-list" class="picker-list"></div>
      </div>
      <div class="toolbar-section">
        <h3>Size Tier</h3>
        <div id="tier-list" class="picker-list"></div>
      </div>
      <div class="toolbar-section">
        <button id="btn-rotate" class="action-btn">⟳ Rotate (R)</button>
        <div id="cost-label" class="cost-label">Cost: $0</div>
      </div>
    </div>

    <div id="toast-container"></div>

    <!-- Layout editor: full-screen overlay shown when a station is selected -->
    <div id="editor-overlay" class="hidden">
      <div id="editor-topbar" class="hud">
        <button id="btn-editor-back" class="action-btn small">← Back to Map</button>
        <span id="editor-station-name">Station</span>
        <div id="editor-level-tabs"></div>
        <button id="btn-upgrade-tier" class="action-btn small upgrade hidden">⬆️ Upgrade</button>
        <button id="btn-walk-mode" class="action-btn small walk">🚶 Walk Mode</button>
      </div>
      <canvas id="layout-canvas"></canvas>
      <div id="editor-palette" class="hud"></div>
      <div id="editor-stats" class="hud"></div>
    </div>

    <!-- Walk mode: minimal HUD shown over the 3D viewport while walking -->
    <div id="walkmode-hud" class="hud hidden">
      <span id="walkmode-hint">WASD to move, mouse to look (click to lock cursor), E/Q to use stairs/escalators/elevators, Esc to exit.</span>
      <button id="btn-walkmode-back" class="action-btn small">← Back to Editor</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
