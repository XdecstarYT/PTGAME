<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transit Tycoon 3D</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three/three.module.js",
    "three/addons/": "./js/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>

  <div id="app">

    <!-- Start menu: scenario / continue picker, shown before play begins -->
    <div id="start-menu">
      <div id="start-menu-box">
        <h1>🚆 Transit Tycoon</h1>
        <div id="start-continue-section"></div>
        <h4>Choose a city</h4>
        <div id="start-scenario-grid"></div>
        <div style="margin-top:14px">
          <label class="action secondary" style="cursor:pointer;display:inline-block">Import Custom Scenario<input type="file" id="start-import-scenario" accept=".json" class="hidden"></label>
        </div>
      </div>
    </div>

    <!-- 3D render target -->
    <canvas id="viewport"></canvas>

    <!-- 2D schematic map overlay -->
    <canvas id="schematic" class="hidden"></canvas>

    <!-- Top HUD bar -->
    <div id="topbar" class="hud">
      <div class="topbar-group brand">
        <span class="brand-title">🚆 Transit Tycoon</span>
      </div>
      <div class="topbar-group stats">
        <div class="stat" id="stat-budget" title="Budget">💰 <span>$0</span></div>
        <div class="stat" id="stat-satisfaction" title="Citywide Satisfaction">😊 <span>--%</span></div>
        <div class="stat" id="stat-ridership" title="Daily Ridership">🧍 <span>0</span></div>
        <div class="stat" id="stat-congestion" title="Road Congestion">🚗 <span>0%</span></div>
        <div class="stat" id="stat-date" title="Date / Time">🗓️ <span>Day 1, 06:00</span></div>
      </div>
      <div class="topbar-group speed-controls">
        <button data-speed="0" class="speed-btn" title="Pause">⏸</button>
        <button data-speed="1" class="speed-btn active" title="1x">▶</button>
        <button data-speed="2" class="speed-btn" title="2x">▶▶</button>
        <button data-speed="4" class="speed-btn" title="4x">▶▶▶</button>
      </div>
      <div class="topbar-group view-toggle">
        <button id="btn-design-vehicle" title="Vehicle Designer">🛠️ Design Vehicle</button>
        <button id="btn-build-creator" title="Building Creator">🏗️ Build</button>
        <button id="btn-view-toggle" title="Toggle schematic map">🗺️ Map</button>
        <button id="btn-heatmap-toggle" title="Cycle demand/crowding heatmap (schematic view only)">🔥 Heatmap: Off</button>
        <button id="btn-audio-toggle" title="Toggle ambient sound">🔇</button>
      </div>
    </div>

    <!-- Ambient news ticker -->
    <div id="news-ticker" class="hud">📰 <span id="news-ticker-text">The city hums along quietly today.</span></div>

    <!-- Left toolbar -->
    <div id="toolbar" class="hud">
      <button class="tool-btn active" data-tool="select" title="Select">🖱️<span>Select</span></button>
      <button class="tool-btn" data-tool="station" title="Place Station">📍<span>Station</span></button>
      <button class="tool-btn" data-tool="route" title="Draw Route">➰<span>Route</span></button>
      <button class="tool-btn" data-tool="vehicle" title="Add Vehicle">🚌<span>Vehicle</span></button>
      <button class="tool-btn" data-tool="depot" title="Place Cargo Depot">🚚<span>Depot</span></button>
      <button class="tool-btn" data-tool="building" title="Place Building">🏢<span>Building</span></button>
      <button class="tool-btn" data-tool="delete" title="Delete">🗑️<span>Delete</span></button>
    </div>

    <!-- Right side panel -->
    <div id="sidepanel" class="hud hidden">
      <div class="panel-header">
        <span id="panel-title">Details</span>
        <button id="panel-close">✕</button>
      </div>
      <div id="panel-content"></div>
    </div>

    <!-- Bottom finance / route strip -->
    <div id="bottombar" class="hud">
      <button id="btn-finance" title="Finance Dashboard">📊 Finance</button>
      <button id="btn-routes" title="Route List">🚏 Routes</button>
      <button id="btn-disruptions" title="Active Disruptions">⚠️ Disruptions<span id="disruption-badge" class="badge hidden">0</span></button>
      <button id="btn-contracts" title="Council Contracts">📜 Contracts<span id="contract-badge" class="badge hidden">0</span></button>
      <button id="btn-save-load" title="Save / Load">💾 Save/Load</button>
      <div id="route-chip-strip"></div>
    </div>

    <!-- Modal layer -->
    <div id="modal-layer" class="hidden">
      <div id="modal-box">
        <div class="modal-header">
          <span id="modal-title">Title</span>
          <button id="modal-close">✕</button>
        </div>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>

    <!-- Route drawing helper banner -->
    <div id="tool-hint" class="hidden"></div>

    <!-- Vehicle Designer overlay -->
    <div id="designer-layer" class="hidden">
      <div class="designer-header">
        <span>🛠️ Vehicle Designer</span>
        <div class="designer-header-actions">
          <button id="designer-showroom-btn">🏷️ Showroom</button>
          <button id="designer-new-btn">＋ New</button>
          <button id="designer-save-btn" class="action">💾 Save</button>
          <button id="designer-close">✕</button>
        </div>
      </div>
      <div class="designer-body">
        <div class="designer-side">
          <div class="designer-tabs">
            <button class="designer-tab active" data-tab="chassis">Chassis</button>
            <button class="designer-tab" data-tab="interior">Interior</button>
            <button class="designer-tab" data-tab="livery">Livery &amp; Consist</button>
            <button class="designer-tab" data-tab="features">Features</button>
            <button class="designer-tab" data-tab="regs">Regulations &amp; ROI</button>
          </div>
          <div class="designer-tab-content" id="designer-tab-content"></div>
        </div>
        <div class="designer-preview">
          <div class="designer-env-buttons">
            <button data-env="daylight" class="active" title="Daylight">☀️</button>
            <button data-env="overcast" title="Overcast">☁️</button>
            <button data-env="night" title="Night">🌙</button>
            <button data-env="rain" title="Rain">🌧️</button>
          </div>
          <div class="designer-walk-buttons">
            <button id="designer-walk-btn" title="Walk the interior in first person">🚶 Walk Interior</button>
          </div>
          <canvas id="designer-viewport"></canvas>
          <div class="designer-stats" id="designer-stats"></div>
          <div id="designer-walk-hud" class="hidden">
            <span>WASD to move, mouse to look (click to lock cursor), E/Q to use stairs between decks, Esc to exit.</span>
            <button id="designer-walk-exit" class="action secondary">← Exit Walk Mode</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Building Creator overlay -->
    <div id="building-layer" class="hidden">
      <div class="designer-header">
        <span>🏗️ Building Creator</span>
        <div class="designer-header-actions">
          <button id="building-showroom-btn">🏷️ Gallery</button>
          <button id="building-new-btn">＋ New</button>
          <button id="building-save-btn" class="action">💾 Save</button>
          <button id="building-close">✕</button>
        </div>
      </div>
      <div class="designer-body">
        <div class="designer-side">
          <div class="designer-tabs">
            <button class="building-tab active" data-tab="structure">Structure</button>
            <button class="building-tab" data-tab="details">Details</button>
          </div>
          <div class="designer-tab-content" id="building-tab-content"></div>
        </div>
        <div class="designer-preview">
          <canvas id="building-viewport"></canvas>
          <div class="designer-stats" id="building-stats"></div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
